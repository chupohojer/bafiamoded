<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Bafia Push Debug</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      margin: 0;
      padding: 16px;
      background: #111;
      color: #eee;
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #bbb; line-height: 1.4; }
    button {
      font: inherit;
      padding: 10px 14px;
      margin: 0 8px 14px 0;
    }
    .entry {
      border: 1px solid #555;
      border-radius: 10px;
      padding: 12px;
      margin: 12px 0;
      background: #1b1b1b;
    }
    .time { font-weight: 700; margin-bottom: 8px; }
    .field { margin: 4px 0; word-break: break-word; }
    .key { color: #8fc7ff; font-weight: 600; }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      background: #090909;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.35;
    }
    .empty { color: #999; }
  </style>
</head>
<body>
  <h1>Bafia Push Debug</h1>
  <p>
    Здесь только сырые FCM/Web Push payload'ы. Страница ничего не отправляет
    в чат и не меняет прочитанность сообщений.
  </p>

  <button id="refresh">Обновить</button>
  <button id="clear">Очистить лог</button>

  <div id="list"></div>

  <script>
    const CACHE_NAME = 'bafia-push-debug-v1';

    const clean = value =>
      value === undefined ||
      value === null
        ? ''
        : String(value);

    async function load() {
      const list =
        document.getElementById('list');

      list.innerHTML =
        '<div class="empty">Загрузка…</div>';

      if(!('caches' in window)) {
        list.innerHTML =
          '<div class="empty">Cache Storage недоступен.</div>';
        return;
      }

      const cache =
        await caches.open(CACHE_NAME);

      const keys =
        await cache.keys();

      const rows = [];

      for(const key of keys) {
        try {
          const response =
            await cache.match(key);

          if(!response)
            continue;

          rows.push(
            await response.json()
          );
        } catch {}
      }

      rows.sort(
        (a, b) =>
          Number(b.receivedAt || 0) -
          Number(a.receivedAt || 0)
      );

      if(rows.length === 0) {
        list.innerHTML =
          '<div class="empty">Пока нет сохранённых push payload.</div>';
        return;
      }

      list.innerHTML = '';

      rows.forEach((row, index) => {
        const payload =
          row.payload &&
          typeof row.payload === 'object'
            ? row.payload
            : {};

        const data =
          payload.data &&
          typeof payload.data === 'object'
            ? payload.data
            : payload;

        const notification =
          payload.notification &&
          typeof payload.notification === 'object'
            ? payload.notification
            : {};

        const box =
          document.createElement('div');

        box.className = 'entry';

        const date =
          new Date(
            Number(row.receivedAt || 0)
          );

        const fields = [
          ['#', String(rows.length - index)],
          ['time', date.toLocaleString()],
          ['title', data.title ?? notification.title],
          ['body', data.body ?? notification.body],
          ['previousBody', data.previousBody],
          ['summaryText', data.summaryText],
          ['notificationGroup', data.notificationGroup],
          ['notificationId', data.notificationId],
          ['notificationGroupSummaryId', data.notificationGroupSummaryId],
          ['deeplinkUri', data.deeplinkUri ?? notification.click_action]
        ];

        for(const [key, value] of fields) {
          const line =
            document.createElement('div');

          line.className = 'field';

          const label =
            document.createElement('span');

          label.className = 'key';
          label.textContent = key + ': ';

          line.appendChild(label);
          line.appendChild(
            document.createTextNode(
              clean(value) || '∅'
            )
          );

          box.appendChild(line);
        }

        const pre =
          document.createElement('pre');

        pre.textContent =
          JSON.stringify(
            payload,
            null,
            2
          );

        box.appendChild(pre);
        list.appendChild(box);
      });
    }

    document
      .getElementById('refresh')
      .onclick = load;

    document
      .getElementById('clear')
      .onclick = async() => {
        await caches.delete(CACHE_NAME);
        await load();
      };

    load();
  </script>
</body>
</html>
